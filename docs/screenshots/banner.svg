<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.55" stop-color="#0A0F1C"/>
      <stop offset="1" stop-color="#0D1526"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#7FD8FF"/>
      <stop offset="1" stop-color="#FF2A6D"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1C2942" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.55"/>

  <!-- horizon glow -->
  <ellipse cx="420" cy="300" rx="520" ry="110" fill="#00E5FF" opacity="0.07"/>
  <ellipse cx="960" cy="300" rx="380" ry="90" fill="#FF2A6D" opacity="0.06"/>

  <!-- wordmark -->
  <g filter="url(#glow)">
    <text x="70" y="140" font-family="Orbitron, 'Segoe UI', Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="6" fill="url(#word)">UURADIO</text>
  </g>
  <rect x="74" y="168" width="640" height="2" fill="url(#line)"/>
  <text x="74" y="204" font-family="Orbitron, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="7" fill="#00E5FF" filter="url(#glowSm)">INTERNET RADIO &#183; IPTV &#183; PTT INTERCOM</text>
  <text x="74" y="240" font-family="'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#8CA3C3">ANDROID &#183; iOS &#183; HARMONYOS &#8212; 赛博朋克霓虹风网络电台播放器</text>

  <!-- right: dial motif -->
  <g transform="translate(985,150)">
    <!-- arc scale -->
    <path d="M -130 60 A 145 145 0 0 1 130 60" fill="none" stroke="#2C3D5E" stroke-width="2"/>
    <g stroke="#8CA3C3" stroke-width="2">
      <line x1="-130" y1="60" x2="-122" y2="48"/>
      <line x1="-104" y1="22" x2="-94" y2="31"/>
      <line x1="-62" y1="-5" x2="-55" y2="7"/>
      <line x1="-12" y1="-18" x2="-10" y2="-5"/>
      <line x1="38" y1="-14" x2="34" y2="-1"/>
      <line x1="84" y1="6" x2="76" y2="16"/>
      <line x1="122" y1="48" x2="130" y2="60"/>
    </g>
    <!-- needle -->
    <line x1="0" y1="66" x2="-34" y2="-12" stroke="#FF2A6D" stroke-width="3" filter="url(#glowSm)"/>
    <circle cx="0" cy="66" r="5" fill="#FF2A6D" filter="url(#glowSm)"/>
    <!-- freq readout -->
    <text x="0" y="-58" text-anchor="middle" font-family="Orbitron, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#00E5FF" filter="url(#glowSm)">98.5</text>
    <text x="0" y="-36" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" letter-spacing="3" fill="#8CA3C3">MHZ &#183; LIVE</text>
    <!-- equalizer -->
    <g fill="url(#wave)">
      <rect x="-84" y="96" width="6" height="26" rx="2"/>
      <rect x="-72" y="86" width="6" height="36" rx="2"/>
      <rect x="-60" y="98" width="6" height="24" rx="2"/>
      <rect x="-48" y="78" width="6" height="44" rx="2"/>
      <rect x="-36" y="92" width="6" height="30" rx="2"/>
      <rect x="-24" y="70" width="6" height="52" rx="2"/>
      <rect x="-12" y="88" width="6" height="34" rx="2"/>
      <rect x="0" y="80" width="6" height="42" rx="2"/>
      <rect x="12" y="94" width="6" height="28" rx="2"/>
      <rect x="24" y="84" width="6" height="38" rx="2"/>
      <rect x="36" y="100" width="6" height="22" rx="2"/>
      <rect x="48" y="90" width="6" height="32" rx="2"/>
      <rect x="60" y="80" width="6" height="42" rx="2"/>
      <rect x="72" y="96" width="6" height="26" rx="2"/>
    </g>
  </g>

  <!-- frame -->
  <rect x="1.5" y="1.5" width="1197" height="297" rx="10" fill="none" stroke="#00E5FF" stroke-opacity="0.35" stroke-width="2"/>
</svg>
