        <line x1="80" y1="20" x2="80" y2="40" stroke="#2C3D5E"/>
        <line x1="120" y1="14" x2="120" y2="46" stroke="#2C3D5E" stroke-width="2"/><text x="120" y="60">95.4</text>
        <line x1="160" y1="20" x2="160" y2="40" stroke="#2C3D5E"/>
        <line x1="200" y1="14" x2="200" y2="46" stroke="#2C3D5E" stroke-width="2"/><text x="200" y="60">96.2</text>
        <line x1="240" y1="20" x2="240" y2="40" stroke="#2C3D5E"/>
        <line x1="280" y1="14" x2="280" y2="46" stroke="#2C3D5E" stroke-width="2"/><text x="280" y="60">97.0</text>
        <line x1="320" y1="20" x2="320" y2="40" stroke="#2C3D5E"/>
        <line x1="360" y1="10" x2="360" y2="50" stroke="#00E5FF" stroke-width="2.5"/><text x="360" y="60" fill="#00E5FF" font-weight="700">98.5</text>
        <line x1="400" y1="20" x2="400" y2="40" stroke="#2C3D5E"/>
        <line x1="440" y1="14" x2="440" y2="46" stroke="#2C3D5E" stroke-width="2"/><text x="440" y="60">99.8</text>
        <line x1="480" y1="20" x2="480" y2="40" stroke="#2C3D5E"/>
      </g>
      <!-- neon dots for stations with signal -->
      <circle cx="120" cy="8" r="3" fill="#00E5FF" opacity="0.7"/>
      <circle cx="200" cy="8" r="3" fill="#00E5FF" opacity="0.7"/>
      <circle cx="280" cy="8" r="3" fill="#00E5FF" opacity="0.7"/>
      <circle cx="360" cy="8" r="4" fill="#00E5FF" filter="url(#g)"/>
      <circle cx="440" cy="8" r="3" fill="#00E5FF" opacity="0.7"/>
    </g>
    <!-- center pointer -->
    <line x1="250" y1="-4" x2="250" y2="70" stroke="#FF2A6D" stroke-width="3" filter="url(#g)"/>
    <path d="M250 -4 l-6 10 h12 z" fill="#FF2A6D"/>
  </g>

