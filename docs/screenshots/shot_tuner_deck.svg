  <text x="606" y="66" text-anchor="end" font-family="Orbitron, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" fill="#DCF3FF">98.5<tspan font-size="14" fill="#8CA3C3"> MHZ</tspan></text>
  <text x="146" y="88" font-family="Consolas, monospace" font-size="11" letter-spacing="1" fill="#8CA3C3">RDS: NIGHT DRIVE &#183; SYNTHWAVE ALL NIGHT LONG</text>
