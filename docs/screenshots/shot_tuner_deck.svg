    <!-- tune wheel -->
    <text x="860" y="52" font-size="9" fill="#5A6880">TUNE</text>
    <rect x="836" y="60" width="48" height="140" rx="14" fill="url(#wheel)" stroke="#2C3D5E"/>
    <g stroke="#05070D" stroke-width="2.5">
      <line x1="840" y1="76" x2="880" y2="76"/><line x1="840" y1="88" x2="880" y2="88"/><line x1="840" y1="100" x2="880" y2="100"/><line x1="840" y1="112" x2="880" y2="112"/><line x1="840" y1="124" x2="880" y2="124"/><line x1="840" y1="136" x2="880" y2="136"/>
    </g>
    <rect x="838" y="138" width="44" height="24" rx="10" fill="#00E5FF" opacity="0.18"/>
    <line x1="840" y1="162" x2="880" y2="162" stroke="#05070D" stroke-width="2.5"/><line x1="840" y1="174" x2="880" y2="174" stroke="#05070D" stroke-width="2.5"/>
    <path d="M860 24 l-6 8 h12 z" fill="#00E5FF"/><path d="M860 236 l-6 -8 h12 z" fill="#00E5FF"/>
