    <rect x="836" y="266" width="48" height="140" rx="14" fill="url(#wheel)" stroke="#2C3D5E"/>
    <g stroke="#05070D" stroke-width="2.5">
      <line x1="840" y1="282" x2="880" y2="282"/><line x1="840" y1="294" x2="880" y2="294"/><line x1="840" y1="306" x2="880" y2="306"/><line x1="840" y1="318" x2="880" y2="318"/><line x1="840" y1="330" x2="880" y2="330"/><line x1="840" y1="342" x2="880" y2="342"/><line x1="840" y1="354" x2="880" y2="354"/><line x1="840" y1="366" x2="880" y2="366"/>
    </g>
    <rect x="838" y="318" width="44" height="24" rx="10" fill="#FF6E27" opacity="0.2"/>
