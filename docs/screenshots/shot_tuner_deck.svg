    <rect x="238" y="18" width="6" height="28" rx="2" fill="#00E5FF"/><rect x="252" y="18" width="6" height="28" rx="2" fill="#00E5FF"/>
    <text x="250" y="58" fill="#00E5FF">PLAY</text>
    <rect x="350" y="0" width="150" height="64" rx="10" fill="url(#key)" stroke="#2C3D5E"/>
    <path d="M400 22 l14 10 -14 10 M414 32 h-26" fill="none" stroke="#DCF3FF" stroke-width="3"/>
    <text x="425" y="58">FF</text>
  </g>

  <!-- ===== right: presets + wheels ===== -->
