h="4" height="16" rx="2" opacity="0.65"/><rect x="354" y="4" width="4" height="36" rx="2"/><rect x="364" y="12" width="4" height="20" rx="2" opacity="0.7"/><rect x="374" y="18" width="4" height="8" rx="2" opacity="0.5"/><rect x="384" y="10" width="4" height="24" rx="2" opacity="0.75"/><rect x="394" y="14" width="4" height="16" rx="2" opacity="0.6"/><rect x="404" y="6" width="4" height="32" rx="2"/><rect x="414" y="12" width="4" height="20" rx="2" opacity="0.7"/><rect x="424" y="8" width="4" height="28" rx="2" opacity="0.8"/><rect x="434" y="16" width="4" height="12" rx="2" opacity="0.6"/><rect x="444" y="10" width="4" height="24" rx="2" opacity="0.75"/><rect x="454" y="14" width="4" height="16" rx="2" opacity="0.65"/><rect x="464" y="18" width="4" height="8" rx="2" opacity="0.5"/>
    </g>
  </g>

  <!-- transport keys -->
