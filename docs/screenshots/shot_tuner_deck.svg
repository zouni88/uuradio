      <text x="658" y="309" font-family="Consolas, monospace" font-size="11" fill="#5A6880">P6</text>
      <text x="684" y="309" font-size="12.5" fill="#8CA3C3">Synth City</text>
      <rect x="646" y="330" width="160" height="40" rx="8" fill="#0A0F1C" stroke="#1C2942"/>
      <text x="658" y="355" font-family="Consolas, monospace" font-size="11" fill="#5A6880">P7</text>
      <text x="684" y="355" font-size="12.5" fill="#8CA3C3">交通广播</text>
