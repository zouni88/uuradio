<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131C31"/>
      <stop offset="0.5" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111A2E"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2942"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="disp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02040A"/>
      <stop offset="1" stop-color="#07101E"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.5" stop-color="#2C3D5E"/>
      <stop offset="1" stop-color="#05070D"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="brush" width="900" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="900" y2="1" stroke="#FFFFFF" stroke-opacity="0.02"/>
    </pattern>
  </defs>

  <!-- panel -->
  <rect width="900" height="440" rx="16" fill="url(#panel)"/>
  <rect width="900" height="440" rx="16" fill="url(#brush)"/>
  <rect x="1" y="1" width="898" height="438" rx="16" fill="none" stroke="#00E5FF" stroke-opacity="0.35" stroke-width="2"/>
  <text x="850" y="30" text-anchor="end" font-family="Orbitron, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#8CA3C3">UURADIO &#183; TUNER DECK</text>

  <!-- ===== left function keys ===== -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="11" text-anchor="middle">
    <rect x="22" y="34" width="86" height="84" rx="10" fill="url(#key)" stroke="#2C3D5E"/>
    <text x="65" y="68" fill="#FF6E27" font-weight="700">&#8250; 退出</text>
    <text x="65" y="86" fill="#5A6880" font-size="9" font-family="Consolas, monospace">EXIT</text>

    <rect x="22" y="130" width="86" height="84" rx="10" fill="url(#key)" stroke="#2C3D5E"/>
    <circle cx="65" cy="166" r="14" fill="none" stroke="#FF6E27" stroke-width="2"/>
    <rect x="59" y="160" width="12" height="12" rx="2" fill="#FF6E27"/>
    <text x="65" y="198" fill="#5A6880" font-size="9" font-family="Consolas, monospace">STOP</text>

    <rect x="22" y="226" width="86" height="84" rx="10" fill="url(#key)" stroke="#00E5FF" stroke-opacity="0.7"/>
    <text x="65" y="262" fill="#00E5FF" font-weight="800" font-family="Orbitron, 'Segoe UI', Arial, sans-serif" font-size="16" filter="url(#g)">BAND</text>
    <text x="65" y="282" fill="#5A6880" font-size="9" font-family="Consolas, monospace">FM1 &#183; 12 ST</text>

    <rect x="22" y="322" width="86" height="84" rx="10" fill="url(#key)" stroke="#2C3D5E"/>
    <path d="M65 348 c-6 -6 -16 -2 -16 6 c0 6 8 12 16 18 c8 -6 16 -12 16 -18 c0 -8 -10 -12 -16 -6 z" fill="none" stroke="#FF6E27" stroke-width="2"/>
    <text x="65" y="392" fill="#5A6880" font-size="9" font-family="Consolas, monospace">FAV</text>
