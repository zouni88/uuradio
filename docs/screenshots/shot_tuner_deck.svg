    <text x="646" y="44" font-family="Orbitron, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#8CA3C3">PRESETS</text>
    <g font-family="'Segoe UI', Arial, sans-serif">
      <rect x="646" y="54" width="160" height="40" rx="8" fill="#0A0F1C" stroke="#1C2942"/>
      <text x="658" y="79" font-family="Consolas, monospace" font-size="11" fill="#5A6880">P1</text>
      <text x="684" y="79" font-size="12.5" fill="#8CA3C3">新闻综合</text>
      <rect x="646" y="100" width="160" height="40" rx="8" fill="#0D1526" stroke="#FF2A6D" stroke-opacity="0.8"/>
      <rect x="642" y="96" width="4" height="48" rx="2" fill="#FF2A6D" filter="url(#g)"/>
      <text x="658" y="125" font-family="Consolas, monospace" font-size="11" fill="#FF2A6D">P2</text>
      <text x="684" y="125" font-size="12.5" fill="#DCF3FF" font-weight="600">Chillwave FM</text>
      <circle cx="792" cy="120" r="4" fill="#00E5FF" filter="url(#g)"/>
      <rect x="646" y="146" width="160" height="40" rx="8" fill="#0A0F1C" stroke="#1C2942"/>
      <text x="658" y="171" font-family="Consolas, monospace" font-size="11" fill="#5A6880">P3</text>
      <text x="684" y="171" font-size="12.5" fill="#8CA3C3">音乐之声</text>
