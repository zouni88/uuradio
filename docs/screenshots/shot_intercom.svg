<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780">
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="g2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="ptt" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#FF2A6D"/><stop offset="1" stop-color="#3A0B18"/>
    </radialGradient>
  </defs>

  <rect width="360" height="780" rx="18" fill="#05070D"/>
  <rect x="0.75" y="0.75" width="358.5" height="778.5" rx="18" fill="none" stroke="#2C3D5E" stroke-width="1.5"/>

  <!-- status bar -->
  <text x="18" y="22" font-family="Consolas, monospace" font-size="12" fill="#DCF3FF">21:37</text>
  <g fill="#DCF3FF">
    <rect x="292" y="14" width="3" height="4"/><rect x="297" y="12" width="3" height="6"/><rect x="302" y="10" width="3" height="8"/><rect x="307" y="8" width="3" height="10"/>
    <path d="M322 16 a7 7 0 0 1 10 0 l-5 5 z"/>
    <rect x="338" y="9" width="14" height="8" rx="2" fill="none" stroke="#DCF3FF"/><rect x="340" y="11" width="8" height="4"/>
  </g>

  <!-- app bar -->
  <text x="16" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="4" fill="#00E5FF" filter="url(#g)">对讲</text>
  <rect x="292" y="38" width="52" height="26" rx="8" fill="none" stroke="#2C3D5E"/>
  <text x="318" y="55" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8CA3C3">退出</text>
  <line x1="0" y1="76" x2="360" y2="76" stroke="#1C2942"/>

  <!-- channel card -->
  <rect x="16" y="94" width="328" height="96" rx="14" fill="#0A0F1C" stroke="#00E5FF" stroke-opacity="0.4"/>
  <text x="32" y="126" font-family="Orbitron, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="2" fill="#DCF3FF">频道 <tspan fill="#00E5FF">#731</tspan></text>
  <g font-family="Consolas, monospace" font-size="10" fill="#8CA3C3">
    <text x="32" y="148">WEBRTC P2P &#183; 32MS &#183; OPUS</text>
  </g>
  <circle cx="306" cy="120" r="4" fill="#05FFA1" filter="url(#g)"/>
  <text x="344" y="124" text-anchor="end" font-family="Consolas, monospace" font-size="9.5" fill="#05FFA1">在线</text>
  <line x1="32" y1="160" x2="328" y2="160" stroke="#1C2942"/>

  <!-- members -->
  <g text-anchor="middle" font-family="Orbitron, 'Segoe UI', Arial, sans-serif" font-weight="800">
    <!-- speaking member -->
    <circle cx="56" cy="164" r="0.1"/>
    <circle cx="56" cy="162" r="17" fill="#05FFA1" opacity="0.12" filter="url(#g2)"/>
    <circle cx="56" cy="162" r="14" fill="#0D1526" stroke="#05FFA1" stroke-width="2"/>
    <text x="56" y="167" font-size="11" fill="#05FFA1">K</text>
    <!-- others -->
    <circle cx="96" cy="162" r="14" fill="#0D1526" stroke="#2C3D5E" stroke-width="1.5"/><text x="96" y="167" font-size="11" fill="#8CA3C3">A</text>
    <circle cx="136" cy="162" r="14" fill="#0D1526" stroke="#2C3D5E" stroke-width="1.5"/><text x="136" y="167" font-size="11" fill="#8CA3C3">M</text>
    <circle cx="176" cy="162" r="14" fill="#0D1526" stroke="#2C3D5E" stroke-width="1.5"/><text x="176" y="167" font-size="11" fill="#8CA3C3">Z</text>
    <circle cx="216" cy="162" r="14" fill="#0D1526" stroke="#2C3D5E" stroke-width="1.5"/><text x="216" y="167" font-size="10" fill="#8CA3C3">+2</text>
  </g>
  <rect x="42" y="180" width="28" height="14" rx="4" fill="#05FFA1" opacity="0.15"/>
  <text x="56" y="190" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#05FFA1">发言中</text>
  <text x="96" y="190" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#8CA3C3">听者</text>
  <text x="136" y="190" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#8CA3C3">听者</text>
  <text x="176" y="190" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#8CA3C3">听者</text>

  <!-- voice activity log -->
  <g font-family="Consolas, monospace" font-size="10">
    <text x="32" y="238" fill="#8CA3C3">话权日志</text>
    <text x="32" y="260" fill="#8CA3C3">21:36:58  <tspan fill="#05FFA1">K</tspan> 抢到话权</text>
    <text x="32" y="278" fill="#8CA3C3">21:36:41  <tspan fill="#DCF3FF">A</tspan> 释放话权 &#183; 12s</text>
    <text x="32" y="296" fill="#8CA3C3">21:36:02  <tspan fill="#DCF3FF">M</tspan> 释放话权 &#183; 8s</text>
  </g>
  <line x1="0" y1="318" x2="360" y2="318" stroke="#1C2942"/>

  <!-- PTT area -->
  <g text-anchor="middle">
    <text x="180" y="352" font-family="Consolas, monospace" font-size="11" letter-spacing="3" fill="#8CA3C3">PUSH TO TALK</text>
    <!-- pulsing rings -->
    <circle cx="180" cy="470" r="118" fill="none" stroke="#FF2A6D" opacity="0.12"/>
    <circle cx="180" cy="470" r="98" fill="none" stroke="#FF2A6D" opacity="0.2"/>
    <circle cx="180" cy="470" r="80" fill="none" stroke="#FF2A6D" opacity="0.3"/>
    <!-- button -->
    <circle cx="180" cy="470" r="66" fill="url(#ptt)" filter="url(#g2)" opacity="0.9"/>
    <circle cx="180" cy="470" r="60" fill="#0A0F1C" stroke="#FF2A6D" stroke-width="2.5" filter="url(#g)"/>
    <!-- mic icon -->
    <g fill="none" stroke="#FF2A6D" stroke-width="2.5">
      <rect x="171" y="444" width="18" height="30" rx="9"/>
      <path d="M162 462 a18 18 0 0 0 36 0"/>
      <line x1="180" y1="480" x2="180" y2="490"/>
      <line x1="170" y1="490" x2="190" y2="490"/>
    </g>
    <text x="180" y="512" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#FF2A6D">按住说话</text>
  </g>
  <text x="180" y="548" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8CA3C3">松开结束发言 · 音频经 P2P 直连，不经服务器</text>

  <!-- audio waves while speaking -->
  <g fill="#FF2A6D">
    <rect x="120" y="600" width="5" height="10" rx="2" opacity="0.7"/>
    <rect x="132" y="596" width="5" height="18" rx="2" opacity="0.8"/>
    <rect x="144" y="592" width="5" height="26" rx="2"/>
    <rect x="156" y="598" width="5" height="14" rx="2" opacity="0.8"/>
    <rect x="168" y="590" width="5" height="30" rx="2"/>
    <rect x="180" y="596" width="5" height="18" rx="2" opacity="0.9"/>
    <rect x="192" y="588" width="5" height="34" rx="2"/>
    <rect x="204" y="596" width="5" height="18" rx="2" opacity="0.8"/>
    <rect x="216" y="594" width="5" height="22" rx="2"/>
    <rect x="228" y="598" width="5" height="14" rx="2" opacity="0.8"/>
  </g>

  <!-- floor state -->
  <rect x="16" y="646" width="328" height="30" rx="8" fill="#0A0F1C" stroke="#1C2942"/>
  <circle cx="34" cy="661" r="4" fill="#FF2A6D" filter="url(#g)"/>
  <text x="48" y="665" font-family="Consolas, monospace" font-size="10.5" fill="#DCF3FF">FLOOR: <tspan fill="#FF2A6D">GRANTED</tspan> &#183; ROOM #731 &#183; 5 PEERS</text>

  <!-- bottom nav -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="10" text-anchor="middle">
    <rect x="0" y="744" width="360" height="36" fill="#070B14"/>
    <path d="M30 749 l7 7 -7 7 -7 -7 z" fill="none" stroke="#8CA3C3"/>
    <text x="30" y="776" fill="#8CA3C3">发现</text>
    <rect x="80" y="750" width="20" height="13" rx="2" fill="none" stroke="#8CA3C3" stroke-width="1.5"/>
    <text x="90" y="776" fill="#8CA3C3">电视</text>
    <circle cx="150" cy="756" r="7" fill="none" stroke="#8CA3C3" stroke-width="1.6"/><line x1="155" y1="761" x2="159" y2="765" stroke="#8CA3C3" stroke-width="1.6"/>
    <text x="150" y="776" fill="#8CA3C3">搜索</text>
    <path d="M208 750 c-3 -3 -8 -1 -8 3 c0 3 4 6 8 9 c4 -3 8 -6 8 -9 c0 -4 -5 -6 -8 -3 z" fill="none" stroke="#8CA3C3" stroke-width="1.5"/>
    <text x="210" y="776" fill="#8CA3C3">收藏</text>
    <rect x="254" y="746" width="36" height="18" rx="9" fill="#00E5FF" opacity="0.14"/>
    <rect x="266" y="749" width="9" height="14" rx="4" fill="none" stroke="#00E5FF" stroke-width="1.5"/><path d="M278 753 a8 8 0 0 1 0 7" fill="none" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="272" y="776" fill="#00E5FF" font-weight="700">对讲</text>
    <circle cx="328" cy="756" r="6.5" fill="none" stroke="#8CA3C3" stroke-width="1.5"/><circle cx="328" cy="756" r="2" fill="#8CA3C3"/><path d="M328 747 v3 M328 762 v3 M319 756 h3 M334 756 h3" stroke="#8CA3C3" stroke-width="1.5"/>
    <text x="328" y="776" fill="#8CA3C3">设置</text>
  </g>
</svg>
