name: iradio
description: "iRadio - Network radio player."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理（手写 Provider，不用 codegen：Dart 3.10 下 generator 依赖链不可解）
  flutter_riverpod: 3.3.2

  # 音频
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4

  # 网络
  dio: ^5.11.1

  # 本地存储
  hive_ce: ^2.22.0
  # 2.4+ 需要 Flutter ≥3.44，本机 3.38.9 钉 2.3.4
  hive_ce_flutter: 2.3.4
  shared_preferences: 2.5.5

  # i18n
  intl: 0.20.2

  # UI
  cached_network_image: 3.4.1

  # 文件
  file_picker: ^13.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/orbitron-500.ttf
          weight: 500
        - asset: assets/fonts/orbitron-700.ttf
          weight: 700
        - asset: assets/fonts/orbitron-900.ttf
          weight: 900
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains-mono-400.ttf
          weight: 400
        - asset: assets/fonts/jetbrains-mono-700.ttf
          weight: 700
